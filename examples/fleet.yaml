# fleet.yaml, declare a set of targets once, scan them all.
# Expand:  dottore fleet examples/fleet.yaml --out .dottore/fleet
# Scan:    dottore fleet examples/fleet.yaml --run
#          (uses the judge declared below; `--judge examples/target.judge.yaml` also works,
#          because that file names the same id, endpoint and credential)
#
# This one is local-only so it runs with no API keys (needs Ollama). For the full menu
# (hosted OpenAI/Anthropic, a raw REST URL, an MCP server), see specs/fleet.example.yaml.
#
# Keys are NEVER written here: each hosted entry names an env var (api_key_env), resolved
# only at send time. `provider` is inferred from the endpoint when omitted: the path first
# (/chat/completions -> openai, /messages -> anthropic), then the host (a host containing
# "anthropic" or "openai"), else rest. Both entries below are therefore `openai`.
version: "1"
targets:
  - id: local-llama-1b
    endpoint: http://localhost:11434/v1/chat/completions
    model: llama3.2:1b

  - id: local-qwen
    endpoint: http://localhost:11434/v1/chat/completions
    model: qwen2.5:1.5b            # ollama pull qwen2.5:1.5b

# The LLM-as-judge for the semantic_judge evaluator. Declared HERE because this file is the
# authorization record: the generated scope authorizes the judge from this block, never from
# a --judge file (a judge file that authorized itself could name any host and any env var).
# `fleet` writes it to <out>/judge.yaml. A hosted judge names its key: api_key_env: NAME.
judge:
  id: local-judge
  endpoint: http://localhost:11434/v1/chat/completions
  model: llama3.2:3b                # ollama pull llama3.2:3b; a stronger model judges
