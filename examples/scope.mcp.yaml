# Authorization for the MCP-server scenario. Default-deny; plain http to loopback only.
version: "1.0"
targets:
  - id: local-mcp                   # must match target.mcp.yaml's id
    base_url: "http://localhost:3000/mcp"
    endpoints:
      - host: "localhost"
        path_prefixes: ["/mcp"]
    identities:
      - name: default
        auth_ref: "env://NONE"      # no credential: env://NONE is never read (a local MCP server usually needs none)
