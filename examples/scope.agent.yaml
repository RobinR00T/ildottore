# scope.agent.yaml, the AUTHORIZATION record for the deployed agent (Scenario I).
#
# Default-DENY, as every scope: the adapter refuses any host or path not listed under `endpoints`
# before the socket is dialled, and a redirect at the upgrade is never followed. The JWT is
# referenced by env-var (`auth_ref`) and read only at send time, never written here. A scope for a
# real agent names a real host: keep it beside its profile, outside any repository.
version: "1.0"
targets:
  - id: agent-staging               # must match target.agent.yaml's id
    base_url: "wss://assistant.example.test/ws"
    endpoints:
      - host: "assistant.example.test:443"   # pinned: a bare host would authorize every port
        path_prefixes: ["/ws"]
    identities:
      - name: default
        auth_ref: "env://ASSISTANT_AGENT_JWT"
