# scope.vision.yaml, the AUTHORIZATION record for the vision-model scenario (Scenario J).
#
# Default-DENY: the adapter refuses any host or path not listed under `endpoints`. The key is
# referenced by env-var (`auth_ref`) and read only at send time, never written here.
version: "1.0"
targets:
  - id: openai-gpt-vision           # must match target.vision.yaml's id
    base_url: "https://api.openai.com/v1/chat/completions"
    endpoints:
      - host: "api.openai.com"
        path_prefixes: ["/v1/chat/completions"]
    identities:
      - name: default
        auth_ref: "env://OPENAI_API_KEY"
