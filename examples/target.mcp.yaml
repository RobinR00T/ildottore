id: local-mcp
type: api                            # an MCP server is a tool provider, not a chat model
provider: mcp                        # routes to the read-only MCP adapter (discovery only)
endpoint: "http://localhost:3000/mcp"   # the MCP Streamable-HTTP endpoint (POST target)
capabilities:
  tools: true
# sampling_defaults: accepted and never sent: MCP discovery carries no sampling (OD-39).
#   sampling_defaults: { temperature: 0.0 }
# The MCP adapter does initialize + tools/resources/prompts list and renders the advertised
# metadata; it never calls a tool. `provider: mcp` makes it an MCP server, which the `mcp`
# capability says without being written (OD-44), so `MCP-TOOLPOISON-001` runs here and on no chat
# model. Scan it with the `mcp` suite:
#   dottore run --suite mcp -t examples/target.mcp.yaml --scope examples/scope.mcp.yaml
#
# Pin the catalogue you reviewed (u04 A-101, MANUAL §4.2 "Pinning an MCP server's catalogue"):
# with pins, the `mcp` suite also sends `MCP-RUGPULL-001`, which fails when the server advertises
# anything other than what was pinned (a definition changed after review, an entry nobody
# reviewed, a reviewed one gone). Take the fingerprints from a reviewed run's JSON report:
#   jq '[.findings[].attempts[].response.raw_ids.mcp_catalogue | select(.)][0]' review.json
# mcp:
#   pins:
#     "tool:read_file": "450eebaa7c7770c88530446943bd1a78fc946e6510f72ef566ab0d7d2cdcb3da"
#     "tool:send_file": "c333a5a1798f713c048c8d7c444cdb177bfa86f4bcbba1a2f7fbdaabef56bcce"
