# scope.yaml - the AUTHORIZATION record. No run starts without covering every target here.
# Default-DENY: adapters refuse any host or path not listed under a target's `endpoints`.
# Plain http is allowed ONLY to loopback (localhost, 127.0.0.1, ::1); everything else https.
# The same for a WebSocket target: wss anywhere allowlisted, cleartext ws only to loopback.
# An optional top-level `checksum:` (sha256 of the body) is verified on load when present, so a
# scope edited without updating it is refused. It is an integrity check, not a signature. Every
# run records the same sha256 in its run store and reports, naming the scope it ran under.
version: "1.0"
targets:
  - id: openai-gpt-x-staging          # must match the id in target.example-openai.yaml
    base_url: "https://api.openai.com/v1/chat/completions"
    endpoints:                        # host + allowed path prefixes (default-deny)
      - host: "api.openai.com"
        path_prefixes: ["/v1/chat/completions"]
    identities:                       # >=1; auth by reference only, never a secret value
      - name: default
        auth_ref: "env://OPENAI_API_KEY"
      # A cross-tenant scan (multi_identity) lists >=2 identities, each with the canary planted
      # in its tenant's data. Write a random token of at least 16 characters: one a reply can
      # hold by chance (under 16 characters, a space, part of an identity name or the target id,
      # holding one with what is left under these floors, too few distinct characters) is
      # refused. The check catches obvious shapes only (a structured id, an address, a date
      # passes), so draw it at random, and name it in no attack prompt.
      # - name: tenant-b
      #   auth_ref: "env://TENANT_B_KEY"
      #   canary: "CANARY-B-3f9c1e7a5b2d8064"
# valid_from: 2026-10-01    # optional: first day authorized (YYYY-MM-DD, UTC, included)
# valid_until: 2026-10-31   # optional: last day authorized; outside the window nothing is sent
# checksum: "<sha256 of the body above>"   # optional integrity check, not a signature (OD-2)
#
# Policy-gated specs (those declaring `requires_policy`, e.g. PII elicitation or the
# agentic-extortion battery) are gated by the run's POLICY PACK, not by this file: the
# default CLI pack enables no capabilities, so such specs are reported `blocked_by_policy`
# with zero sends until a pack deliberately opts in.
