[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ildottore"
version = "0.1.0"
description = "Il Dottore: spec-driven security scanner for LLMs and AI applications (nmap-for-AI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dani Solis", email = "daniel.solis@zynap.com" }]
keywords = ["llm", "security", "red-team", "owasp-llm", "mitre-atlas", "prompt-injection", "ai-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.6",
  # 6.0.1: 6.0 has no CPython 3.11 wheel and its sdist does not build under Cython 3 (u12 A-84).
  "pyyaml>=6.0.1",
  "jsonschema>=4.21",
  "httpx>=0.27",
  # Security floor for anyio, a transitive dep pulled in by httpx: 4.14.2 fixes
  # CVE-2026-63349 / CVE-2026-63374 / CVE-2026-64847 (pip-audit).
  "anyio>=4.14.2",
  # 3.1.6: the CVEs fixed from 3.1.3 to 3.1.6 (sandbox escapes, xmlattr) are below it (u12 A-84).
  "jinja2>=3.1.6",
  # The WebSocket client of the `provider: websocket` adapter (BSD-3-Clause). 15.0 is the
  # first release whose asyncio client takes `proxy`, which adapters/websocket.py passes (14.0
  # added `additional_headers`).
  "websockets>=15.0",
  # 0.26.8: the oldest typer the suite has run on (click 8.2 breaks typer before 0.15.4/0.16);
  # it requires rich>=13.8.0, so rich's floor rises with it (u12 A-84).
  "typer>=0.26.8",
  "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23.5",
  # The tests import click.testing and click's exceptions, and typer declares no click: 8.4.2 is
  # the release the suite has passed on (u12 A-84).
  "click>=8.4.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "respx>=0.21",
  "coverage>=7.5",
  # The static checks, pinned exactly, so a local `make gates` and CI read the code with the same
  # rules: ranges let CI pick up newer releases (ruff 0.17.2 against 0.15.20 locally, mypy 2.4.0
  # against 2.1.0) and a rule only the newer ruff knew failed only there. Dependabot's
  # `python-dev` group proposes the bumps; its PR carries whatever a new release asks of the code.
  "ruff==0.17.2",
  "mypy==2.4.0",
  "import-linter==2.15",
  "types-PyYAML==6.0.12.20260906",
  "types-jsonschema==4.26.0.20261006",
]

[project.scripts]
dottore = "ildottore.cli.main:main"
dott = "ildottore.cli.main:main"

# Third-party extension points (see docs/06). Our own plugins register here too.
[project.entry-points."dottore.evaluators"]
[project.entry-points."dottore.mutators"]
[project.entry-points."dottore.adapters"]

[project.urls]
Homepage = "https://github.com/RobinR00T/ildottore"
Documentation = "https://github.com/RobinR00T/ildottore/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/ildottore"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
# S101 (assert) allowed in tests; handled per-file below.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
exclude = ['^\.venv/', '^build/']
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Tests use pytest fixtures/parametrize decorators that mypy strict flags on decorators.
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/ildottore"]
branch = true

[tool.bandit]
# B105 (hardcoded_password_string) is skipped because it only ever false-positives here: the
# evaluator-type / verdict StrEnum values ("secret_leakage", "pass", ...) and the attack
# translation vocabulary ("password"/"secret" dict keys in mutators/translate.py) are data, not
# credentials. Hardcoded-secret coverage is not lost: ruff's flake8-bandit S105/S106/S107 stay
# active (see the `# noqa: S105` markers in shared/enums.py), so a real hardcoded password is
# still caught at the ruff layer. Inline `# nosec` was avoided for B105 because bandit's line
# accounting is thrown off by the CJK characters in translate.py (spurious warning storm).
# B311 (non-crypto random) and B405 (xml import) remain active and are suppressed surgically
# per-line with `# nosec` where they are by-design (seeded reproducible RNG; writing JUnit XML).
skips = ["B105"]

# Package-boundary contract (docs/01 §2, §6) lives in the standalone `.importlinter` file
# (owned by u14-self-validation-ci). It is intentionally NOT duplicated here - having both a
# `[tool.importlinter]` block and a `.importlinter` file double-defines the root package.
