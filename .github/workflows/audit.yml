# audit - proactive nightly validator + regression / metamorphic run (docs/07 §5, contract §5.4).
#
# CI (ci.yml) is the per-PR merge gate. This workflow is the *proactive* layer: it runs the full
# regression golden-run snapshot and the metamorphic suite (validation-plan layers 16 & 18) and
# the whole gate stack every night, so drift is caught between merges rather than only at PR time.
# Both jobs install the NEWEST release of every dependency, with no constraints: the PR jobs of
# ci.yml install the pinned ci-constraints-requirements.txt (OD-49, u14 A-123), so this is where
# a break in a new release shows, the night it lands and outside any PR. The fix is a pin bump
# (Dependabot's or a hand one) or a code change, in a PR of its own.
#
# NOTE (open decision OD, contract §9): this workflow requests **read-only** permissions by
# default. Any write action (e.g. auto-filing a regression issue) is left OPERATOR-PENDING - a
# maintainer must opt in via Settings → Actions → Workflow permissions. We do not silently grant
# write.

name: audit

on:
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC - regression, metamorphic and the full sweep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0" # determinism-replay stability (layer 9)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  regression:
    name: nightly regression + metamorphic (layers 16, 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (editable + dev, newest releases)
        run: python -m pip install -e ".[dev]"

      # Layer 16 - golden-run regression snapshot. A frozen reference run must produce a stable
      # report; the snapshot diff is conductor-reviewed (snapshots in tests/reporting/fixtures/reports/).
      - name: "Regression · golden-run snapshot"
        run: pytest -q tests/reporting/test_golden_snapshot.py

      # Layer 18 - metamorphic: a semantics-preserving mutation must not change the verdict;
      # a strictly-stronger attack must not reduce detection.
      - name: "Metamorphic · verdict invariance"
        run: pytest -q tests/evaluators/test_deterministic.py

      # Full determinism replay at a fixed seed (layer 9) - the nightly canary for flakiness.
      - name: "Determinism · replay at fixed seed"
        run: pytest -q tests/core/test_determinism.py tests/core/test_reproduce.py

      - name: "Self-scan · dogfood the judge (layer 17)"
        run: python -m tests.selfscan.run --out reports/self-scan.sarif.json

  full-sweep:
    # Nightly since OD-49 (2026-11-02), weekly before: with the PR jobs pinned, this is the
    # first run to meet a new release.
    name: nightly full gate sweep (newest releases, no constraints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (editable + dev, newest releases)
        run: python -m pip install -e ".[dev]"

      - name: Installed versions
        run: python -m pip freeze

      - name: Static (ruff · format · mypy · import-linter)
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src
          lint-imports

      - name: Spec lint (layers 1-2)
        run: dottore lint src/ildottore/battery/attacks

      - name: Full suite + coverage gate (core ≥ 85%)
        run: |
          pytest -q \
            --cov=src/ildottore \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-fail-under=85

      - name: Upload sweep artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports
          path: reports/
          if-no-files-found: warn
