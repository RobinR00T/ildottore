# Conforms to the canonical Suite model (u00 `ildottore.shared.Suite`): `suite_version`,
# ordered `specs: [{spec_id}]`, `default_runs`, `tags`. Entries are require-present by
# default (SuiteEntry.enabled=true) - a suite can't silently shrink. Suite-level
# `sampling`/`fail_on` defaults are MVP-2 (not yet modeled); kept as comments (docs/03 §5).
id: owasp-llm-top10
suite_version: "2025.1"
name: OWASP LLM Top 10 (2025) baseline suite
description: >
  Baseline assurance suite mapping to OWASP LLM Top 10 (2025). Ships the full T0 "Quick" battery
  (docs/08 §3, 18 ids) covering prompt injection, jailbreak, system-prompt/data leakage, insecure
  output handling, excessive agency and unbounded consumption. Adding a technique = add a spec id
  here (no code change). DL-PII-ELICIT-001 is present but off unless the policy pack enables
  layer-B PII elicitation (OD-11 / docs/11 §5).

default_runs: 5
# MVP-2 (unmodeled) defaults: sampling { temperature: 0.0, top_p: 1.0, seed: 42 }; fail_on: high
#   (CI gate: confirmed high/critical breaks the pipeline)
tags: [owasp, mitre-atlas, nist-ai-rmf]

# Ordered spec references (declared order == run order).
specs:
  # --- LLM01 Prompt Injection ---
  - spec_id: PI-DIRECT-001               # direct instruction override
  - spec_id: PI-INDIRECT-RAG-001         # indirect via retrieved document
  - spec_id: PI-INDIRECT-TOOL-001        # indirect via tool/function output
  # --- LLM01 Jailbreak block ---
  - spec_id: JB-ROLEPLAY-001             # roleplay / persona (DAN-class)
  - spec_id: JB-REFUSAL-SUPPRESS-001     # refusal-suppression prefix
  - spec_id: JB-ENCODING-001             # base64 / rot13 / leetspeak encoding bypass
  # --- LLM07 System Prompt Leakage ---
  - spec_id: SP-LEAK-001                 # system prompt extraction
  # --- LLM02 Sensitive Information Disclosure ---
  - spec_id: DL-SECRET-CANARY-001        # secret/canary leakage
  - spec_id: DL-XSESSION-001             # cross-session / cross-user leakage
  - spec_id: DL-MEMORIZE-DIVERGENCE-001  # training-data regurgitation (requires logprobs)
  - spec_id: DL-XTENANT-001              # cross-tenant leak (requires multi_identity)
  - spec_id: DL-PII-ELICIT-001           # PII elicitation (test_only; off by default, OD-11)
  # --- LLM05 Improper Output Handling ---
  - spec_id: OUT-CODEINJ-001             # insecure code generation
  - spec_id: OUT-XSS-001                 # XSS / unescaped HTML
  - spec_id: OUT-SQLI-001                # unsafe SQL generation
  # --- LLM06 Excessive Agency ---
  - spec_id: AG-TOOL-UNAUTH-001          # unauthorized / over-permissioned tool call
  - spec_id: AG-CONFIRM-BYPASS-001       # destructive action without confirmation
  # --- LLM10 Unbounded Consumption ---
  - spec_id: DOS-TOKEN-AMP-001           # token amplification / unbounded output
