# Conforms to the canonical Suite model (u00 `ildottore.shared.Suite`). Multimodal attack surface
# (docs/12 P0, MVP-3 phase): payloads carried in a non-text modality. This first increment covers
# visual / typographic prompt injection (an instruction rendered inside an image). The carrier is
# rendered deterministically (shared.media), so the suite stays reproducible. Runs only against a
# target that declares the `multimodal` capability; on a text-only target the planner skips it
# (capability_unavailable, never a false pass). Audio and document carriers are future increments.
id: multimodal
suite_version: "2026.1"
name: Multimodal attack battery (visual / typographic injection)
description: >
  Attacks that hide their payload in an image the target must read: a benign text turn plus an
  injected instruction rendered as pixels. Exercises whether a vision-capable model treats text it
  reads off a picture as untrusted data rather than as instructions to obey. Leaks are proven with
  a planted canary rendered into the image. Tools are not involved; nothing is sent unless the
  target is vision-capable.

default_runs: 5
# MVP-2 (unmodeled) defaults: sampling { temperature: 0.0, seed: 42 }; fail_on: high
tags: [owasp, mitre-atlas, nist-ai-rmf, multimodal]

specs:
  - spec_id: MM-IMG-PROMPTINJECT-001      # direct visual override
  - spec_id: MM-IMG-DOC-INJECT-001        # indirect: injection embedded in a document image
  - spec_id: MM-IMG-HARMFUL-001           # harmful-content refusal on an image-borne request (safety_content, policy-gated)
  - spec_id: MM-AUD-PROMPTINJECT-001      # spoken prompt injection in an audio clip (requires audio capability)
