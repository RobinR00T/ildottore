id: openai-gpt-x-staging
type: model                         # model | chatbot | agent | rag | api
provider: openai
endpoint: "https://api.openai.com/v1/chat/completions"
model: "gpt-4o"                     # provider model id
auth_ref: "env://OPENAI_API_KEY"    # never inline secrets; only env:// is supported (no vault://)
capabilities:
  tools: false
  rag: false
  memory: false
  streaming: true
  seed: true                        # provider supports seed → determinism recorded
sampling_defaults: { temperature: 0.0, top_p: 1.0 }
# The Policy Engine cross-checks this endpoint against scope.yaml's allowlist before any call.
# A deployed application (any type but `model`) declares which specs' documents, tools and memory
# its operator has seeded, under `seeded_setup` (OD-18 B); see examples/target.app.yaml.
