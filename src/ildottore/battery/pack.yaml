# Built-in spec pack manifest. Its presence makes this directory (`ildottore/battery`, inside the
# package, so a wheel carries it) a spec pack (docs/06 §2): the registry loader reads
# attacks/*.yaml + suites/*.yaml, which is what lets `dottore run --quick` with no --spec-path
# find the battery out of the box, in a source checkout and an installed wheel alike (u12 A-84).
id: ildottore-builtin
